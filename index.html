<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación a Misa</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        graphite: '#4B5563', // Gris oscuro elegante
                        silver: '#9CA3AF',   // Gris claro para detalles
                        bone: '#F9FAFB',     // Fondo casi blanco, suave
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Cormorant Garamond', 'serif'],
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #F3F4F6; /* Fondo general un poco más gris para destacar la tarjeta */
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 1.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .border-delicate {
            border: 1px solid rgba(156, 163, 175, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-8">

    <!-- Contenedor principal (Diseño clásico y sereno) -->
    <div class="bg-white shadow-[0_10px_40px_rgba(0,0,0,0.08)] w-full max-w-md mx-auto rounded-xl relative overflow-hidden animate-fade-in-up border-delicate pb-12">
        
        <!-- FOTO PRINCIPAL (Imagen serena) -->
        <div class="relative h-[22rem] w-full">
            <!-- Usamos una imagen de flores blancas, símbolo de paz -->
            <img 
                src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                alt="Detalle floral" 
                class="object-cover w-full h-full opacity-90"
            />
            <!-- Gradiente blanco muy suave para fusionar con el contenido -->
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-white/50 to-white"></div>
        </div>

        <div class="px-10 text-center relative z-10 -mt-20">
            
            <!-- Cruz simple o detalle ornamental (Opcional, en este caso una línea muy fina) -->
            <div class="flex justify-center mb-6">
                 <div class="w-px h-8 bg-silver/60"></div>
            </div>
            
            <p class="text-[10px] font-sans tracking-[0.2em] text-silver uppercase mb-4">En memoria de</p>
            
            <!-- Nombre del difunto -->
            <h1 class="text-4xl sm:text-5xl font-serif text-graphite mb-3 leading-tight font-medium">Carlos Robles</h1>
            <h2 class="text-3xl font-serif text-graphite mb-6 leading-none">Mendoza</h2>
            
            <p class="font-serif italic text-graphite/80 text-lg mb-8 px-4">
                "Aquellos que amamos no se van, caminan junto a nosotros cada día."
            </p>
            
            <!-- Divisor sutil -->
            <div class="flex justify-center mb-8">
                <div class="w-16 h-px bg-silver/30"></div>
            </div>

            <!-- Datos de Fecha y Hora -->
            <div class="mb-8">
                <p class="font-sans font-medium tracking-widest text-graphite uppercase text-[10px] mb-2">Misa de Aniversario</p>
                <div class="flex justify-center items-center space-x-4 mb-2">
                    <p class="font-sans tracking-wider text-xs text-graphite">VIERNES</p>
                    <p class="font-serif text-3xl text-graphite">14</p>
                    <p class="font-sans tracking-wider text-xs text-graphite">JUNIO</p>
                </div>
                <p class="font-sans text-[11px] text-silver mt-1">19:00 hrs</p>
            </div>

            <!-- Lugar -->
            <div class="mb-10">
                <h3 class="font-serif text-xl text-graphite mb-2">Parroquia de San Miguel Arcángel</h3>
                <p class="font-sans text-xs text-gray-500 font-light px-2">Av. Revolución 456, Centro Histórico</p>
                
                <a href="#" class="inline-block mt-4 text-[10px] tracking-widest uppercase text-silver border-b border-silver/50 pb-1 hover:text-graphite hover:border-graphite transition-colors">
                    Ver Ubicación
                </a>
            </div>

            <!-- Script para WhatsApp -->
            <script>
                function confirmarAsistencia() {
                    const telefono = "525512345678"; 
                    const mensaje = encodeURIComponent("Buenas tardes. Acompañaremos a la familia en la misa de Carlos.");
                    const url = `https://wa.me/${telefono}?text=${mensaje}`;
                    window.open(url, '_blank');
                }
            </script>

            <button 
                onclick="confirmarAsistencia()" 
                class="w-full bg-white border border-silver/30 hover:bg-gray-50 text-graphite font-sans text-[10px] tracking-[0.15em] uppercase py-3.5 rounded transition-all duration-300 flex items-center justify-center shadow-sm"
            >
                Confirmar asistencia
            </button>
            <p class="text-[9px] text-silver mt-3 uppercase tracking-widest">Familia Robles Mendoza</p>

        </div>
    </div>

</body>
</html>
