<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Mágica</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'magic-purple': '#9B8BE2',
                        'magic-pink': '#FFB5D3',
                        'magic-blue': '#A3E3F9',
                    },
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'],
                        cursive: ['Caveat', 'cursive'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Nunito', sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .golden-ticket {
            background: linear-gradient(135deg, #FFDF73 0%, #F5B041 50%, #FFDF73 100%);
            border-radius: 16px;
            color: #8A5A19;
            box-shadow: 0 10px 20px rgba(245, 176, 65, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        /* Efecto de brillo animado en el ticket */
        .golden-ticket::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(30deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(30deg); }
            20% { transform: translateX(100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-10 px-4">

    <div class="glass-card w-full max-w-md mx-auto rounded-[2.5rem] overflow-hidden shadow-2xl relative p-6 border-4 border-white/50">
        
        <!-- Decoración superior flotante (Círculos difuminados) -->
        <div class="absolute -top-10 -left-10 w-40 h-40 bg-magic-pink rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-pulse"></div>
        <div class="absolute top-20 -right-10 w-40 h-40 bg-magic-blue rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-pulse" style="animation-delay: 1s;"></div>

        <div class="relative z-10 text-center pt-8">
            <h2 class="font-cursive text-3xl text-magic-purple mb-2">¡Un día mágico te espera!</h2>
            <h1 class="font-sans font-black text-6xl text-transparent bg-clip-text bg-gradient-to-r from-magic-purple to-magic-pink mb-6">Valeria</h1>
            <p class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-10">Mis 5 Añitos</p>

            <!-- PASE VIP TIPO GOLDEN TICKET -->
            <div class="golden-ticket p-1 border-2 border-white/40 mb-8">
                <div class="border-2 border-dashed border-[#8A5A19]/30 rounded-xl p-4 bg-white/20 backdrop-blur-sm">
                    <div class="flex justify-between items-center border-b border-[#8A5A19]/20 pb-3 mb-3">
                        <span class="text-xs uppercase font-bold tracking-widest">Pase de Entrada</span>
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                    </div>
                    <h3 class="font-black text-2xl mb-1 text-[#5c3c10]">Familia Invitada</h3>
                    <p class="text-sm font-bold">Pases: <span class="bg-white/50 px-2 py-1 rounded text-[#5c3c10] ml-1">3 Personas</span></p>
                </div>
            </div>

            <!-- Detalles -->
            <div class="space-y-4 mb-8">
                <div class="bg-white/80 rounded-2xl p-4 shadow-sm border border-gray-100">
                    <p class="font-bold text-magic-purple uppercase text-xs tracking-widest mb-1">Cuándo</p>
                    <p class="text-lg font-bold text-gray-700">Domingo 20 de Noviembre</p>
                    <p class="text-gray-500 text-sm">3:00 PM</p>
                </div>
                <div class="bg-white/80 rounded-2xl p-4 shadow-sm border border-gray-100">
                    <p class="font-bold text-magic-purple uppercase text-xs tracking-widest mb-1">Dónde</p>
                    <p class="text-lg font-bold text-gray-700">Terraza "Cielo"</p>
                    <p class="text-gray-500 text-sm">Calle de las Nubes 789</p>
                </div>
            </div>

            <!-- Botón -->
            <button onclick="window.open('https://wa.me/521234567890', '_blank')" class="w-full bg-gradient-to-r from-magic-purple to-magic-pink text-white font-black text-lg py-4 rounded-full shadow-[0_10px_20px_rgba(255,181,211,0.4)] hover:scale-105 transition-transform duration-300">
                Confirmar Asistencia ✨
            </button>
        </div>
    </div>
</body>
</html>
