<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV Años - VIP Pass</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'xv-dark': '#111111',
                        'xv-rosegold': '#B76E79',
                        'xv-gold': '#D4AF37',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                        script: ['Great Vibes', 'cursive'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #0a0a0a; 
            color: #ffffff;
        }
        
        .rose-gradient-text {
            background: linear-gradient(to right, #e0a9b2, #B76E79, #e0a9b2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Diseño tipo "Wallet Pass" de Apple/Android */
        .wallet-pass {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            position: relative;
        }
        
        .wallet-pass::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(to right, #B76E79, #e0a9b2, #B76E79);
        }

        /* Código QR simulado con CSS grid para darle un toque tecnológico VIP */
        .qr-placeholder {
            width: 120px;
            height: 120px;
            background: #fff;
            padding: 8px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
        }
        .qr-placeholder div { background: #111; border-radius: 2px; }
        .qr-placeholder div:nth-child(even) { opacity: 0.8; }
        .qr-placeholder div:nth-child(3n) { opacity: 0.4; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-10 px-4">

    <div class="w-full max-w-md mx-auto relative">
        
        <!-- Decoración trasera sutil -->
        <div class="absolute inset-0 border border-[#B76E79]/30 transform translate-x-2 translate-y-2 rounded-2xl"></div>

        <div class="bg-xv-dark border border-white/10 rounded-2xl p-8 relative z-10">
            
            <div class="text-center mb-10">
                <p class="font-sans text-[10px] tracking-[0.4em] text-xv-rosegold uppercase mb-6">Mis XV Años</p>
                <h1 class="font-serif text-5xl mb-2 text-white">Isabella</h1>
                <p class="font-script text-4xl rose-gradient-text mt-4">García Mendoza</p>
            </div>

            <!-- PASE DIGITAL TIPO WALLET -->
            <div class="wallet-pass mb-10">
                <div class="p-6 bg-[#1f1f1f]">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <p class="text-[9px] uppercase tracking-widest text-gray-400 mb-1">Evento VIP</p>
                            <p class="font-serif text-xl text-white">Recepción</p>
                        </div>
                        <div class="text-right border border-xv-rosegold/50 rounded px-3 py-1">
                            <p class="text-[8px] uppercase text-xv-rosegold">Mesa</p>
                            <p class="font-bold text-lg">Asignada</p>
                        </div>
                    </div>

                    <div class="flex justify-center mb-6">
                        <!-- QR Simulado -->
                        <div class="qr-placeholder relative">
                            <div></div><div></div><div></div><div></div>
                            <div></div><div class="bg-xv-rosegold! opacity-100!"></div><div></div><div></div>
                            <div></div><div></div><div></div><div class="bg-xv-rosegold! opacity-100!"></div>
                            <div></div><div></div><div></div><div></div>
                            <!-- Overlay para hacerlo ver real pero inescaneable -->
                            <div class="absolute inset-0 flex items-center justify-center backdrop-blur-[1px]">
                                <div class="bg-xv-dark rounded px-2 py-1 border border-white/20">
                                    <span class="text-[8px] text-white tracking-widest">SCAN VIP</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="border-t border-dashed border-gray-700 pt-4 flex justify-between">
                        <div>
                            <p class="text-[9px] text-gray-500 uppercase tracking-widest">Familia</p>
                            <p class="text-sm font-semibold">García López</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] text-gray-500 uppercase tracking-widest">Pases</p>
                            <p class="text-lg font-bold text-xv-rosegold">2</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Datos Formales -->
            <div class="text-center space-y-6 mb-10 font-sans">
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-widest mb-2">Ceremonia Religiosa</p>
                    <p class="font-serif text-lg">Parroquia de San Miguel</p>
                    <p class="text-sm text-gray-300">18:00 HRS</p>
                </div>
                
                <div class="flex justify-center">
                    <div class="w-10 h-[1px] bg-xv-rosegold/50"></div>
                </div>

                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-widest mb-2">Recepción</p>
                    <p class="font-serif text-lg">Hacienda Los Arcángeles</p>
                    <p class="text-sm text-gray-300">20:30 HRS</p>
                </div>

                <div class="mt-6 p-4 border border-white/10 bg-white/5 rounded-lg">
                    <p class="text-[10px] text-xv-rosegold uppercase tracking-[0.2em] mb-1">Dress Code</p>
                    <p class="text-sm font-semibold tracking-wider">Etiqueta Rigurosa</p>
                </div>
            </div>

            <!-- Botón formal -->
            <button onclick="window.open('https://wa.me/521234567890', '_blank')" class="w-full bg-transparent border border-xv-rosegold text-xv-rosegold hover:bg-xv-rosegold hover:text-white transition-colors duration-500 font-sans text-xs tracking-[0.2em] uppercase py-4 rounded-sm flex items-center justify-center">
                Confirmar Asistencia
            </button>
        </div>
    </div>
</body>
</html>
