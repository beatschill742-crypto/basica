<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación Especial</title>
    
    <!-- Cargamos Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración personalizada de colores y fuentes -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#C5A059', // Un dorado elegante
                        dark: '#2C3E50', // Gris oscuro casi azul
                        cream: '#FDFBF7', // Fondo crema cálido
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Cormorant Garamond', 'serif'],
                    }
                }
            }
        }
    </script>

    <!-- Importamos fuentes de Google Fonts para un toque más elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Librería para el efecto de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #FDFBF7;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px); /* Patrón de puntos muy sutil tipo papel */
            background-size: 40px 40px;
        }
        
        .animate-slide-up {
            animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    
    <!-- Script para disparar el confeti al cargar -->
    <script>
        window.addEventListener('load', () => {
            // Un pequeño retraso para que coincida con la animación de la tarjeta
            setTimeout(() => {
                var duration = 3 * 1000;
                var animationEnd = Date.now() + duration;
                var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

                function randomInRange(min, max) {
                    return Math.random() * (max - min) + min;
                }

                var interval = setInterval(function() {
                    var timeLeft = animationEnd - Date.now();

                    if (timeLeft <= 0) {
                        return clearInterval(interval);
                    }

                    var particleCount = 50 * (timeLeft / duration);
                    
                    // Confeti desde la izquierda
                    confetti(Object.assign({}, defaults, { 
                        particleCount, 
                        origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                        colors: ['#C5A059', '#2C3E50', '#ffffff'] // Colores que combinan con la invitación
                    }));
                    
                    // Confeti desde la derecha
                    confetti(Object.assign({}, defaults, { 
                        particleCount, 
                        origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                        colors: ['#C5A059', '#2C3E50', '#ffffff']
                    }));
                }, 250);
            }, 500); // 500ms de retraso
        });
    </script>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-8">

    <!-- Contenedor principal (Diseño tipo 'Arco' muy en tendencia para invitaciones) -->
    <div class="bg-white shadow-[0_20px_50px_rgba(0,0,0,0.05)] w-full max-w-md mx-auto rounded-t-[15rem] rounded-b-3xl relative overflow-hidden animate-slide-up border border-gray-100 pb-10">
        
        <!-- FOTO PRINCIPAL -->
        <div class="relative h-[26rem] w-full">
            <img 
                src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                alt="Foto de la pareja" 
                class="object-cover w-full h-full"
            />
            <!-- Gradiente para que el texto se mezcle suavemente con la foto -->
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-white/40 to-white"></div>
        </div>

        <!-- CONTENIDO DE LA INVITACIÓN -->
        <div class="px-8 text-center relative z-10 -mt-24">
            
            <p class="text-[10px] font-sans tracking-[0.25em] text-gold uppercase mb-4">Tenemos el honor de invitarte</p>
            
            <!-- Nombres -->
            <h1 class="text-5xl sm:text-6xl font-serif text-dark mb-1 leading-none">María</h1>
            <p class="text-3xl font-serif text-gold italic my-0">&</p>
            <h1 class="text-5xl sm:text-6xl font-serif text-dark mb-8 leading-none">Alejandro</h1>
            
            <!-- Divisor elegante -->
            <div class="flex justify-center mb-8">
                <svg width="40" height="12" viewBox="0 0 40 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 11.5L16.5 6L20 0.5L23.5 6L20 11.5Z" fill="#C5A059" fill-opacity="0.6"/>
                    <line x1="0" y1="6" x2="15" y2="6" stroke="#C5A059" stroke-opacity="0.3"/>
                    <line x1="25" y1="6" x2="40" y2="6" stroke="#C5A059" stroke-opacity="0.3"/>
                </svg>
            </div>

            <!-- Datos de Fecha y Hora (Estilo Minimalista) -->
            <div class="border-y border-gold/20 py-5 mx-4 mb-10">
                <p class="font-sans font-medium tracking-widest text-gold uppercase text-[11px] mb-1">Sábado</p>
                <p class="font-serif text-4xl text-dark my-1">15</p>
                <p class="font-sans tracking-widest uppercase text-[11px] text-gray-500 mt-2">Octubre 2026 • 18:00 hrs</p>
            </div>

            <!-- Lugar -->
            <div class="mb-10">
                <h3 class="font-serif text-2xl italic text-dark mb-2">Jardín Los Encinos</h3>
                <p class="font-sans text-sm text-gray-500 font-light px-4">Av. Las Palmas 123, Ciudad Elegante</p>
                
                <a href="#" class="inline-block mt-4 text-[10px] tracking-widest uppercase text-gold border-b border-gold pb-1 hover:text-dark hover:border-dark transition-colors">
                    Ver Ubicación en Mapa
                </a>
            </div>

            <!-- Botón de WhatsApp -->
            <script>
                function confirmarAsistencia() {
                    const telefono = "525512345678"; 
                    const mensaje = encodeURIComponent("¡Hola María y Alejandro! ✨ Confirmo mi asistencia con mucho gusto a su boda. Nos vemos el 15 de Octubre.");
                    const url = `https://wa.me/${telefono}?text=${mensaje}`;
                    window.open(url, '_blank');
                }
            </script>

            <button 
                onclick="confirmarAsistencia()" 
                class="w-full bg-dark hover:bg-black text-white font-sans text-[11px] tracking-widest uppercase py-4 rounded-full transition-all duration-300 flex items-center justify-center shadow-lg"
            >
                <!-- Icono de WhatsApp minimalista -->
                <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                </svg>
                Confirmar Asistencia
            </button>
            <p class="text-[9px] text-gray-400 mt-4 uppercase tracking-widest">vía WhatsApp</p>

        </div>
    </div>

</body>
</html>
